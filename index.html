<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>David Llona | Frontend developer</title>
  <meta name="description"
    content="Portfolio de David Llona, frontend developer. Un pequeño planeta en 3D que puedes explorar para ver mis proyectos." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/png" href="/images/flaticon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="David Llona | Frontend developer" />
  <meta property="og:description"
    content="Un pequeño planeta en 3D que puedes explorar para ver mis proyectos." />
  <meta property="og:url" content="https://davidllona.com/" />
  <meta property="og:image" content="https://davidllona.com/images/projects/portfolio.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=block: el texto espera a la tipografía en vez de aparecer primero con otra. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet">
</head>

<body>
  <!-- Pantalla de carga. Va aquí, con su estilo en línea, para que se pinte antes de que
       llegue el JavaScript: el astronauta espera sentado mientras se prepara el universo.
       La controla src/ui/loaderControl.js, que la retira cuando la bienvenida está lista. -->
  <style>
    #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 62%, #101a44 0%, #070a22 55%, #04041a 100%);
      color: #ededed; font-family: "Bricolage Grotesque", system-ui, sans-serif; transition: opacity .7s ease, visibility .7s; }
    #loader.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader svg { display: block; width: min(88vw, 700px); margin-top: -6vh; height: auto; overflow: visible; }
    .ld-brand { position: absolute; top: clamp(18px, 4vh, 40px); left: clamp(20px, 5vw, 64px); margin: 0;
      font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 800; font-stretch: 75%; font-variation-settings: "wdth" 75; text-transform: uppercase; }
    .ld-brand span { color: #ff6b2c; }
    .ld-info { position: absolute; left: 0; right: 0; bottom: clamp(26px, 8vh, 78px); text-align: center; }
    .ld-number { margin: 0; font-size: clamp(2.6rem, 7vw, 4.4rem); font-weight: 800; font-stretch: 75%;
      font-variation-settings: "wdth" 75; line-height: 1; font-variant-numeric: tabular-nums; }
    .ld-number small { margin-left: 4px; font-size: .4em; color: #ff6b2c; }
    .ld-track { width: min(60vw, 300px); height: 3px; margin: 14px auto 12px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
    .ld-bar { height: 100%; background: #ff6b2c; transform: scaleX(0); transform-origin: left; }
    .ld-step { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; letter-spacing: .04em; color: #b9bdd2; }
    .ld-float { animation: ld-float 5.2s ease-in-out infinite; transform-origin: 200px 190px; }
    .ld-leg-a, .ld-leg-b { transform-box: fill-box; transform-origin: 50% 6%; animation: ld-swing 2.3s ease-in-out infinite; }
    .ld-leg-b { animation-delay: -1.15s; }
    .ld-torso { transform-box: fill-box; transform-origin: 50% 100%; animation: ld-breathe 3.4s ease-in-out infinite; }
    .ld-head { transform-box: fill-box; transform-origin: 50% 80%; animation: ld-look 7s ease-in-out infinite; }
    .ld-arm { transform-box: fill-box; transform-origin: 20% 10%; animation: ld-arm 9s ease-in-out infinite; }
    .ld-tail { transform-box: fill-box; transform-origin: 0% 100%; animation: ld-wag 1.1s ease-in-out infinite; }
    .ld-doghead { transform-box: fill-box; transform-origin: 80% 80%; animation: ld-dog 8s ease-in-out infinite; }
    .ld-glow { animation: ld-glow 2.6s ease-in-out infinite; }
    .ld-star { animation: ld-twinkle 3s ease-in-out infinite; }
    .ld-star:nth-child(2n) { animation-delay: -1.1s; } .ld-star:nth-child(3n) { animation-delay: -2s; }
    .ld-mote { animation: ld-drift 9s linear infinite; }
    .ld-mote:nth-child(2n) { animation-duration: 12s; animation-delay: -4s; }
    /* Fin de la carga: deja de balancear las piernas, se incorpora y Woody levanta la cabeza. */
    #loader.is-done .ld-leg-a, #loader.is-done .ld-leg-b { animation: none; }
    #loader.is-done .ld-astro { transition: transform .55s cubic-bezier(.3,1.4,.5,1); transform: translate(-4px, -17px); }
    #loader.is-done .ld-doghead { animation: none; transition: transform .4s ease; transform: rotate(-16deg) translateY(-5px); }
    @keyframes ld-float { 50% { transform: translateY(-7px) rotate(-.6deg); } }
    @keyframes ld-swing { 0%, 100% { transform: rotate(9deg); } 50% { transform: rotate(-11deg); } }
    @keyframes ld-breathe { 50% { transform: scaleY(1.035); } }
    @keyframes ld-look { 0%, 55%, 100% { transform: rotate(0); } 68%, 86% { transform: rotate(-11deg) translateX(-1px); } }
    @keyframes ld-arm { 0%, 78%, 100% { transform: rotate(0); } 84%, 92% { transform: rotate(-24deg); } }
    @keyframes ld-wag { 50% { transform: rotate(-24deg); } }
    @keyframes ld-dog { 0%, 60%, 100% { transform: rotate(0); } 70%, 84% { transform: rotate(-13deg) translateY(-3px); } }
    @keyframes ld-glow { 50% { opacity: .62; } }
    @keyframes ld-twinkle { 50% { opacity: .25; } }
    @keyframes ld-drift { from { transform: translate(0, 0); opacity: 0; } 15%, 80% { opacity: .7; } to { transform: translate(-26px, -70px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #loader * { animation: none !important; } }
  </style>
  <div id="loader" role="status" aria-label="Cargando el planeta">
    <p class="ld-brand">David <span>Llona</span></p>
    <svg viewBox="0 0 400 300" aria-hidden="true">
      <defs>
        <radialGradient id="ld-warm" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffcf8a" stop-opacity=".9" /><stop offset=".45" stop-color="#ff9a4a" stop-opacity=".28" /><stop offset="1" stop-color="#ff9a4a" stop-opacity="0" />
        </radialGradient>
      </defs>
      <g fill="#dfe7ff">
        <circle class="ld-star" cx="34" cy="42" r="1.6" /><circle class="ld-star" cx="92" cy="18" r="1.1" /><circle class="ld-star" cx="148" cy="58" r="1.3" />
        <circle class="ld-star" cx="318" cy="30" r="1.7" /><circle class="ld-star" cx="368" cy="92" r="1.2" /><circle class="ld-star" cx="276" cy="66" r="1" />
        <circle class="ld-star" cx="20" cy="150" r="1.2" /><circle class="ld-star" cx="382" cy="206" r="1.4" /><circle class="ld-star" cx="60" cy="238" r="1" />
        <circle class="ld-star" cx="336" cy="262" r="1.1" /><circle class="ld-star" cx="206" cy="22" r="1.2" /><circle class="ld-star" cx="120" cy="268" r="1.3" />
      </g>
      <g fill="#ffd9a0">
        <circle class="ld-mote" cx="120" cy="210" r="1.5" /><circle class="ld-mote" cx="300" cy="230" r="1.2" /><circle class="ld-mote" cx="250" cy="150" r="1.3" /><circle class="ld-mote" cx="90" cy="130" r="1.1" />
      </g>
      <g class="ld-float">
        <!-- Roca flotante, facetada. -->
        <polygon points="96,186 142,170 214,164 286,172 318,190 280,204 190,210 118,202" fill="#8f8a9c" />
        <polygon points="96,186 118,202 190,210 174,246 128,228" fill="#5f5a70" />
        <polygon points="190,210 280,204 318,190 292,232 236,256 174,246" fill="#4a4660" />
        <polygon points="174,246 236,256 214,284 190,270" fill="#383450" />
        <polygon points="142,170 214,164 196,178 132,182" fill="#a6a1b4" />
        <!-- Farol y su luz cálida. -->
        <circle class="ld-glow" cx="262" cy="158" r="44" fill="url(#ld-warm)" />
        <rect x="259" y="148" width="7" height="22" rx="1" fill="#5b3f2b" /><rect x="254.5" y="142" width="16" height="12" rx="2" fill="#ffcf7a" /><polygon points="252,142 262.5,134 273,142" fill="#5b3f2b" />
        <!-- Woody, tumbado. -->
        <g>
          <path class="ld-tail" d="M110 180 q-12 -6 -14 -18" fill="none" stroke="#2b2a33" stroke-width="5" stroke-linecap="round" />
          <ellipse cx="134" cy="182" rx="26" ry="11" fill="#2b2a33" />
          <polygon points="140,186 158,186 152,192 142,192" fill="#f2efe6" />
          <rect x="150" y="186" width="18" height="6" rx="3" fill="#2b2a33" />
          <g class="ld-doghead">
            <polygon points="150,162 168,160 176,170 170,180 152,180 146,172" fill="#34333d" />
            <polygon points="150,162 146,152 157,159" fill="#2b2a33" />
            <polygon points="170,172 180,172 177,178 170,180" fill="#2b2a33" /><circle cx="164" cy="168" r="1.6" fill="#c98a4a" />
          </g>
        </g>
        <!-- Astronauta sentado en el borde, con las piernas colgando. -->
        <g class="ld-astro">
          <g class="ld-leg-b"><rect x="205" y="186" width="13" height="34" rx="6" fill="#d9cdb6" /><rect x="203" y="214" width="17" height="12" rx="4" fill="#e0662a" /></g>
          <g class="ld-torso">
            <rect x="182" y="140" width="15" height="38" rx="5" fill="#cfc2a8" />
            <rect x="192" y="138" width="34" height="48" rx="12" fill="#f6ead6" />
            <rect x="196" y="156" width="26" height="5" rx="2.5" fill="#ff6b2c" /><rect x="200" y="166" width="9" height="9" rx="2" fill="#1fb3a4" />
            <g class="ld-arm"><rect x="216" y="146" width="11" height="32" rx="5.5" fill="#e9dcc4" /><circle cx="221.5" cy="180" r="6" fill="#e0662a" /></g>
            <g class="ld-head">
              <circle cx="209" cy="118" r="22" fill="#f6ead6" /><rect x="204" y="96" width="10" height="7" rx="3" fill="#ff6b2c" />
              <ellipse cx="214" cy="120" rx="14" ry="12" fill="#15131f" /><ellipse cx="219" cy="115" rx="4" ry="2.5" fill="#3a3566" />
            </g>
          </g>
          <g class="ld-leg-a"><rect x="190" y="184" width="14" height="36" rx="6.5" fill="#f6ead6" /><rect x="188" y="214" width="18" height="13" rx="4" fill="#ff6b2c" /></g>
        </g>
      </g>
    </svg>
    <div class="ld-info">
      <p class="ld-number"><span id="loader-number">0</span><small>%</small></p>
      <div class="ld-track"><div class="ld-bar" id="loader-bar"></div></div>
      <p class="ld-step" id="loader-step">Preparando el universo…</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
