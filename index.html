<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>David Llona | Frontend developer</title>
  <meta name="description"
    content="Portfolio de David Llona, frontend developer. Un pequeño planeta en 3D que puedes explorar para ver mis proyectos." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/png" href="/images/flaticon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="David Llona | Frontend developer" />
  <meta property="og:description"
    content="Un pequeño planeta en 3D que puedes explorar para ver mis proyectos." />
  <meta property="og:url" content="https://davidllona.com/" />
  <meta property="og:image" content="https://davidllona.com/images/projects/portfolio.png" />

  <!-- La imagen de la pantalla de carga se pide antes que nada: se pinta de inmediato. -->
  <link rel="preload" as="image" href="/loader/farol.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/loader/escena.webp" type="image/webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=block: el texto espera a la tipografía en vez de aparecer primero con otra. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet">
</head>

<body>
  <!-- Pantalla de carga. Va aquí, con su estilo en línea, para que se pinte antes de que
       llegue el JavaScript. La imagen es un render de Blender de los modelos reales del juego
       (tools/blender/loader.py) en dos capas: la escena con luz de luna y, encima, la misma con
       el farol encendido, cuya opacidad tiembla. La controla src/ui/loaderControl.js. -->
  <style>
    #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 58%, #121c4a 0%, #080b26 55%, #04041a 100%);
      color: #ededed; font-family: "Bricolage Grotesque", system-ui, sans-serif; transition: opacity .7s ease, visibility .7s; }
    #loader.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    .ld-brand { position: absolute; top: clamp(18px, 4vh, 40px); left: clamp(20px, 5vw, 64px); margin: 0;
      font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 800; font-stretch: 75%; font-variation-settings: "wdth" 75; text-transform: uppercase; }
    .ld-brand span { color: #ff6b2c; }
    /* Fondo: nebulosa muy tenue, estrellas de tres tamaños que parpadean y un planeta a lo lejos. */
    .ld-nebula { position: absolute; inset: -10%; background:
      radial-gradient(38% 30% at 24% 30%, rgba(108, 92, 231, .2), transparent 70%),
      radial-gradient(34% 28% at 78% 64%, rgba(255, 107, 44, .09), transparent 70%),
      radial-gradient(30% 24% at 66% 18%, rgba(64, 160, 255, .13), transparent 70%); animation: ld-nebula 26s ease-in-out infinite alternate; }
    .ld-stars { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; animation: ld-twinkle 3.4s ease-in-out infinite; }
    .ld-stars--a { box-shadow: 62.3vw 68.2vh 0 0px #ffe9c9, 94.2vw 68.1vh 0 0px #ffe9c9, 2.9vw 42.8vh 0 0px #ffffff, 64.9vw 82.9vh 0 0px #ffffff, 37.2vw 79.9vh 0 0px #dfe8ff, 54.4vw 52.8vh 0 0px #ffffff, 73.1vw 37.5vh 0 0px #ffffff, 91.6vw 70.4vh 0 0px #ffffff, 76.2vw 6.6vh 0 0px #ffe9c9, 61.7vw 11.7vh 0 0px #ffffff, 97.2vw 0.5vh 0 0px #ffffff, 96.0vw 15.3vh 0 0px #ffffff, 28.9vw 88.5vh 0 0px #ffe9c9, 87.6vw 57.6vh 0 0px #ffffff, 94.1vw 63.5vh 0 0px #dfe8ff, 29.9vw 33.2vh 0 0px #ffffff, 93.6vw 24.3vh 0 0px #dfe8ff, 30.1vw 55.5vh 0 0px #ffffff, 59.6vw 65.1vh 0 0px #ffffff, 31.0vw 75.3vh 0 0px #dfe8ff, 69.6vw 17.0vh 0 0px #dfe8ff, 70.5vw 5.2vh 0 0px #ffffff, 94.9vw 32.9vh 0 0px #dfe8ff, 1.8vw 72.5vh 0 0px #dfe8ff, 37.6vw 77.4vh 0 0px #dfe8ff, 4.7vw 16.6vh 0 0px #ffffff, 11.9vw 22.6vh 0 0px #dfe8ff, 34.4vw 32.6vh 0 0px #ffe9c9, 25.1vw 42.6vh 0 0px #ffe9c9, 74.8vw 73.3vh 0 0px #dfe8ff, 3.7vw 87.0vh 0 0px #ffffff, 20.8vw 47.2vh 0 0px #dfe8ff, 91.8vw 31.3vh 0 0px #ffe9c9, 54.5vw 28.7vh 0 0px #dfe8ff, 30.6vw 73.5vh 0 0px #ffe9c9, 14.9vw 63.4vh 0 0px #dfe8ff, 16.2vw 4.5vh 0 0px #ffe9c9, 53.4vw 37.3vh 0 0px #ffffff, 74.1vw 31.6vh 0 0px #dfe8ff, 45.6vw 38.8vh 0 0px #ffffff, 97.9vw 58.7vh 0 0px #dfe8ff, 33.4vw 19.0vh 0 0px #ffe9c9, 56.4vw 12.2vh 0 0px #dfe8ff, 10.7vw 40.0vh 0 0px #ffffff, 5.9vw 38.7vh 0 0px #ffffff, 45.3vw 91.9vh 0 0px #ffffff; opacity: .8; }
    .ld-stars--b { box-shadow: 97.6vw 41.7vh 0 0.6px #dfe8ff, 68.9vw 29.2vh 0 0.6px #dfe8ff, 29.1vw 37.1vh 0 0.6px #ffffff, 11.3vw 75.6vh 0 0.6px #ffe9c9, 96.0vw 57.7vh 0 0.6px #dfe8ff, 86.8vw 16.6vh 0 0.6px #dfe8ff, 27.2vw 71.9vh 0 0.6px #ffe9c9, 36.1vw 72.3vh 0 0.6px #dfe8ff, 69.5vw 61.1vh 0 0.6px #dfe8ff, 36.3vw 64.8vh 0 0.6px #dfe8ff, 83.5vw 24.4vh 0 0.6px #ffe9c9, 71.6vw 88.0vh 0 0.6px #dfe8ff, 65.0vw 53.4vh 0 0.6px #ffffff, 47.4vw 71.2vh 0 0.6px #dfe8ff, 67.2vw 42.6vh 0 0.6px #ffe9c9, 64.7vw 73.4vh 0 0.6px #dfe8ff, 27.4vw 31.8vh 0 0.6px #dfe8ff, 35.0vw 77.5vh 0 0.6px #ffe9c9, 45.0vw 33.5vh 0 0.6px #dfe8ff, 51.8vw 48.7vh 0 0.6px #ffffff, 19.9vw 33.3vh 0 0.6px #dfe8ff, 28.3vw 7.3vh 0 0.6px #ffe9c9; animation-duration: 4.6s; animation-delay: -1.7s; }
    .ld-stars--c { box-shadow: 73.0vw 15.8vh 0 1.1px #ffe9c9, 51.6vw 86.2vh 0 1.1px #dfe8ff, 62.4vw 71.3vh 0 1.1px #ffe9c9, 27.1vw 91.6vh 0 1.1px #ffffff, 16.0vw 40.6vh 0 1.1px #ffe9c9, 18.1vw 69.8vh 0 1.1px #ffffff, 63.1vw 3.9vh 0 1.1px #dfe8ff, 98.0vw 15.2vh 0 1.1px #ffffff, 11.1vw 89.1vh 0 1.1px #dfe8ff; animation-duration: 2.7s; animation-delay: -.9s; }
    .ld-planet { position: absolute; left: 12vw; top: 17vh; width: clamp(54px, 9vh, 96px); height: auto; opacity: .85; animation: ld-planet 16s ease-in-out infinite; }
    /* La escena: cerca del 45 % del alto (la imagen trae algo de margen transparente). */
    .ld-stage { position: relative; height: min(54vh, 76vw); aspect-ratio: 1080 / 800; margin-top: -9vh; animation: ld-float 6.5s ease-in-out infinite; }
    .ld-stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ld-light { animation: ld-flicker 3.1s linear infinite; }
    .ld-halo { position: absolute; left: 49.5%; top: 40%; width: 62%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 168, 82, .34), rgba(255, 150, 60, .1) 46%, transparent 72%); animation: ld-flicker 3.1s linear infinite; }
    /* Motas de luz que suben desde el farol. */
    .ld-mote { position: absolute; left: 49.5%; top: 34%; width: 4px; height: 4px; border-radius: 50%; background: #ffd08a;
      box-shadow: 0 0 8px 2px rgba(255, 176, 96, .7); opacity: 0; animation: ld-rise 5.5s linear infinite; }
    .ld-mote:nth-child(2) { --dx: -34px; animation-delay: -1.2s; animation-duration: 6.4s; }
    .ld-mote:nth-child(3) { --dx: 26px; animation-delay: -2.6s; }
    .ld-mote:nth-child(4) { --dx: 52px; animation-delay: -3.9s; animation-duration: 7s; }
    .ld-mote:nth-child(5) { --dx: -12px; animation-delay: -4.6s; animation-duration: 4.8s; }
    .ld-info { position: absolute; left: 0; right: 0; bottom: clamp(22px, 6.5vh, 70px); text-align: center; }
    .ld-number { margin: 0; font-size: clamp(2.6rem, 7vw, 4.4rem); font-weight: 800; font-stretch: 75%;
      font-variation-settings: "wdth" 75; line-height: 1; font-variant-numeric: tabular-nums; }
    .ld-number small { margin-left: 4px; font-size: .4em; color: #ff6b2c; }
    .ld-track { width: min(60vw, 300px); height: 3px; margin: 14px auto 12px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
    .ld-bar { height: 100%; background: #ff6b2c; transform: scaleX(0); transform-origin: left; }
    .ld-step { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; letter-spacing: .04em; color: #b9bdd2; }
    @keyframes ld-float { 50% { transform: translateY(-9px) rotate(-.5deg); } }
    @keyframes ld-flicker { 0%, 100% { opacity: 1; } 8% { opacity: .86; } 13% { opacity: .97; } 31% { opacity: .9; } 36% { opacity: 1; } 58% { opacity: .8; } 63% { opacity: .95; } 82% { opacity: .88; } }
    @keyframes ld-twinkle { 50% { opacity: .3; } }
    @keyframes ld-nebula { to { transform: translate(2%, -1.5%) scale(1.06); } }
    @keyframes ld-planet { 50% { transform: translateY(-6px) rotate(4deg); } }
    @keyframes ld-rise { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 12% { opacity: .9; } 70% { opacity: .5; } 100% { transform: translate(var(--dx, 14px), -21vh) scale(.2); opacity: 0; } }
    @media (max-aspect-ratio: 1/1) { .ld-planet { left: 9vw; top: 13vh; } .ld-stage { margin-top: -12vh; } }
    @media (prefers-reduced-motion: reduce) { #loader * { animation: none !important; } }
  </style>
  <div id="loader" role="status" aria-label="Cargando el planeta">
    <div class="ld-nebula"></div>
    <i class="ld-stars ld-stars--a"></i><i class="ld-stars ld-stars--b"></i><i class="ld-stars ld-stars--c"></i>
    <img class="ld-planet" src="/loader/planeta.webp" width="300" height="300" alt="" decoding="async" />
    <p class="ld-brand">David <span>Llona</span></p>
    <div class="ld-stage">
      <div class="ld-halo"></div>
      <img src="/loader/escena.webp" width="1080" height="800" alt="" fetchpriority="high" />
      <img class="ld-light" src="/loader/farol.webp" width="1080" height="800" alt="El astronauta sentado en una roca junto a Woody y un farol" fetchpriority="high" />
      <span class="ld-mote"></span><span class="ld-mote"></span><span class="ld-mote"></span><span class="ld-mote"></span><span class="ld-mote"></span>
    </div>
    <div class="ld-info">
      <p class="ld-number"><span id="loader-number">0</span><small>%</small></p>
      <div class="ld-track"><div class="ld-bar" id="loader-bar"></div></div>
      <p class="ld-step" id="loader-step">Preparando el universo…</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
